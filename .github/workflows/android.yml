name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android source
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*v0_5*source*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Could not find the v0.5 source ZIP in the repository."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS_FILE="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts not found inside source ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Normalize Arabic, Urdu and Persian abjad letters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("extracted").rglob("MainActivity.kt"))
          if not files:
              raise SystemExit("MainActivity.kt not found in extracted source")
          p = files[0]
          s = p.read_text(encoding="utf-8")
          old = '''    val total = input.sumOf { values[it] ?: 0 }
              val known = input.filter { values.containsKey(it) }
              val unknown = input.filter { !values.containsKey(it) && !it.isWhitespace() }
              val breakdown = known.map { "$it = ${values[it]}" }'''
          new = '''    val total = input.sumOf { normalizedAbjadValue(it, values) ?: 0 }
              val known = input.filter { normalizedAbjadValue(it, values) != null }
              val unknown = input.filter { !it.isWhitespace() && !it.isLetterOrDigit().not() && normalizedAbjadValue(it, values) == null }
              val breakdown = known.map { "$it = ${normalizedAbjadValue(it, values)}" }'''
          if old not in s:
              old2 = '''    val total = input.sumOf { values[it] ?: 0 }
              val known = input.filter { values.containsKey(it) }
              val unknown = input.filter { !values.containsKey(it) && !it.isWhitespace() }
              val breakdown = known.map { "$it = ${values[it]}" }'''
              if old2 not in s:
                  raise SystemExit("Expected abjad calculation block not found; refusing unsafe patch")
              old = old2
          s = s.replace(old, new, 1)
          marker = "@Composable\nfun AbjadScreen"
          helper = '''private fun normalizedAbjadValue(ch: Char, values: Map<Char, Int>): Int? {
              if (ch == 'ـ' || Character.getType(ch) == Character.NON_SPACING_MARK.toInt()) return null
              val base = when (ch) {
                  'ہ', 'ۀ', 'ة' -> 'ه'
                  'ی', 'ى', 'ئ' -> 'ي'
                  'أ', 'إ', 'آ' -> 'ا'
                  'ؤ' -> 'و'
                  'ء' -> 'ا'
                  else -> ch
              }
              return values[base]
          }

          @Composable
          fun AbjadScreen'''
          if "private fun normalizedAbjadValue" not in s:
              if marker not in s:
                  raise SystemExit("AbjadScreen marker not found")
              s = s.replace(marker, helper, 1)
          p.write_text(s, encoding="utf-8")
          print("Patched:", p)
          PY
      - name: Align Kotlin JVM target with Android Java target
        shell: bash
        run: |
          CI_SCRIPT="$GITHUB_WORKSPACE/ci-jvm-target.gradle"
          cat > "$CI_SCRIPT" <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.class.name.contains('KotlinCompile')) {
                      task.kotlinOptions.jvmTarget = '1.8'
                  }
              }
          }
          EOF
      - name: Build debug APK
        run: gradle --no-daemon -I "$GITHUB_WORKSPACE/ci-jvm-target.gradle" -p "$GITHUB_WORKSPACE/$PROJECT_DIR" :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANJA-NAQOOSH-MAKER-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
